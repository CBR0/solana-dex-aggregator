[package]
name = "solroute-aggregator"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "solroute-cli"
path = "src/main.rs"

[[bin]]
name = "sample-cache"
path = "src/bin/sample_cache.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[[bin]]
name = "simulate"
path = "src/bin/simulate.rs"

[[bin]]
name = "land"
path = "src/bin/land.rs"

[dependencies]
# Workspace DEX crates
solroute-core = { path = "../core" }
raydium-amm-v4 = { path = "../raydium-amm-v4" }
raydium-clmm = { path = "../raydium-clmm" }
meteora-damm = { path = "../meteora-damm" }
meteora-dlmm = { path = "../meteora-dlmm" }
orca-whirlpool = { path = "../orca-whirlpool" }
pumpfun-amm = { path = "../pumpfun-amm" }
bonk = { path = "../bonk" }
meteora-dbc = { path = "../meteora-dbc" }
solroute-executor = { path = "../executor" }

# Workspace deps
solana-sdk = { workspace = true }
solana-pubkey = { workspace = true }
solana-message = { workspace = true }
solana-account = { workspace = true }
solana-keypair = { workspace = true }
solana-signer = { workspace = true }
solana-signature = { workspace = true }
serde = { workspace = true }
borsh = { workspace = true }

# Async + RPC
tokio = { version = "1", features = ["full"] }
futures = "0.3"
solana-rpc-client = "4"
solana-rpc-client-api = "4"
solana-account-decoder-client-types = "4"
solana-commitment-config = "3"

# CLI
indicatif = "0.17"
rustyline = "15"

# Serialization / stats
sysinfo = "0.34"
bincode = "1.3"
serde_json = "1.0"

[[bin]]
name = "multihop"
path = "src/bin/multihop.rs"

[[bin]]
name = "sim-pool"
path = "src/bin/sim_pool.rs"

[[bin]]
name = "sim-route"
path = "src/bin/sim_route.rs"
