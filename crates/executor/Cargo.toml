[package]
name = "solroute-executor"
version = "0.1.0"
edition = "2024"

[dependencies]
orca-whirlpool = { path = "../orca-whirlpool" }
solroute-core = { path = "../core" }
raydium-amm-v4 = { path = "../raydium-amm-v4" }
raydium-clmm = { path = "../raydium-clmm" }

borsh = { workspace = true }
bincode = "1.3"

solana-sdk = { workspace = true }
solana-pubkey = { workspace = true }
solana-message = { workspace = true }
solana-transaction = { workspace = true }
solana-signature = { workspace = true }
solana-hash = { workspace = true }
solana-keypair = { workspace = true }
solana-signer = { workspace = true }
# Version pin only (types come via solana-pubkey re-export); see workspace.
solana-address = { workspace = true }
# Version pin only (pulled via transaction-status); see workspace.
solana-reward-info = { workspace = true }
solana-system-interface = { workspace = true }


solana-rpc-client = "4"
solana-rpc-client-api = "4"
solana-commitment-config = "3"
solana-address-lookup-table-interface = { version = "3", features = ["bincode"] }
