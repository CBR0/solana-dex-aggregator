[package]
name = "solroute"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/raydium-amm-v4",
    "crates/raydium-clmm",
    "crates/meteora-damm",
    "crates/meteora-dlmm",
    "crates/pumpfun-amm",
    "crates/orca-whirlpool",
    "crates/bonk",
    "crates/meteora-dbc",
    "crates/aggregator",
    "crates/engine",
    "crates/executor",
]

[[bin]]
name = "solroute-engine"
path = "bin/engine.rs"

[dependencies]
solroute-core = { path = "crates/core" }
raydium-amm-v4 = { path = "crates/raydium-amm-v4" }
raydium-clmm = { path = "crates/raydium-clmm" }
meteora-damm = { path = "crates/meteora-damm" }
meteora-dlmm = { path = "crates/meteora-dlmm" }
orca-whirlpool = { path = "crates/orca-whirlpool" }
pumpfun-amm = { path = "crates/pumpfun-amm" }
solroute-engine = { path = "crates/engine" }
solroute-aggregator = { path = "crates/aggregator" }
solana-rpc-client = "4"
solana-commitment-config = "3"
solana-pubkey = { workspace = true }
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"

[dev-dependencies]
tokio = { version = "1.43.0", features = ["rt-multi-thread", "macros", "time"] }
futures = "0.3.31"
dotenvy = "0.15"

# Integration tests
solana-sdk = { workspace = true }
solana-rpc-client = "4"
solana-commitment-config = "3"
bincode = "1.3"
solana-rpc-client-api = "4"
serde = { workspace = true }
borsh = { workspace = true }

# Geyser streaming
yellowstone-grpc-client = "11.0"
yellowstone-grpc-proto = { version = "11.0", features = ["plugin"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

solana-pubkey = { workspace = true }
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1.0"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }

solana-sdk = "~4.1"
# serde + borsh + curve25519 (PDA derivation) enabled explicitly on the
# single pubkey 4.x copy used tree-wide.
solana-pubkey = { version = "4", features = ["serde", "borsh", "curve25519"] }
# Train 4.6 (Agave 4.6): message 4.5+ e transaction 4.2+ usam wincode 0.6.
# A família precisa caminhar junta; message 4.2+ carrega o formato v1.
solana-message = "~4.6"
solana-transaction = "~4.3"
solana-signature = "~3.5"
solana-hash = "~4.6"
solana-address = "~2.7"
solana-keypair = "^3.1.2"
solana-signer = "3"
solana-reward-info = "6"
solana-account = "~4.6"
solana-system-interface = { version = "3", features = ["bincode"] }


borsh = "1.6"
